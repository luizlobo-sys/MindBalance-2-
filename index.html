<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MindBalance, seu espaço de bem-estar</title>
  <meta name="description" content="MindBalance: check-in de humor, diário, respiração e meditações guiadas. Seus dados ficam só no seu aparelho.">
  <meta name="theme-color" content="#f2f6f3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <!-- Tela de bloqueio (aparece só se o PIN estiver ativado) -->
  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <img src="icons/favicon.svg" alt="" width="64" height="64">
      <h1>MindBalance</h1>
      <p>Digite seu PIN ou senha para abrir.</p>
      <label class="sr" for="lock-input">PIN ou senha</label>
      <input id="lock-input" class="input" type="password" autocomplete="current-password">
      <p id="lock-error" class="error" role="alert" hidden></p>
      <button class="btn primary block" data-action="unlock">Abrir</button>
      <button class="btn link" data-action="forgot-pin">Esqueci meu PIN</button>
    </div>
  </div>

  <div class="shell" id="shell">
    <header class="topbar">
      <a class="brand" href="#/inicio" aria-label="MindBalance, ir para o início">
        <img src="icons/favicon.svg" alt="" width="36" height="36">
        <span class="brand-text"><strong>MindBalance</strong><small>Projeto LUMINI 2026</small></span>
      </a>
      <div class="top-actions">
        <button class="btn help-btn" data-action="help" aria-label="Preciso de ajuda">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9.2C1.3 8.6 3 5 6.4 5c2 0 3.5 1.1 4.3 2.5h2.6C14.1 6.1 15.6 5 17.6 5 21 5 22.7 8.6 21.3 11.8 19 16.4 12 21 12 21z"/></svg>
          <span class="hb-long" aria-hidden="true">Preciso de ajuda</span><span class="hb-short" aria-hidden="true">Ajuda</span>
        </button>
        <a class="icon-btn" href="#/config" aria-label="Configurações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/></svg>
        </a>
      </div>
    </header>

    <nav class="nav" aria-label="Principal">
      <a href="#/inicio" data-route="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Início</span></a>
      <a href="#/checkin" data-route="checkin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg><span>Check-in</span></a>
      <a href="#/respirar" data-route="respirar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg><span>Respirar</span></a>
      <a href="#/diario" data-route="diario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/></svg><span>Diário</span></a>
      <a href="#/painel" data-route="painel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Painel</span></a>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">O MindBalance precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.</p>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
